<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Apollo Express — Log Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#EDEFF2;
      --paper-2:#FFFFFF;
      --ink:#171D24;
      --slate:#6B7688;
      --line:#D8DCE3;
      --amber:#C1662B;
      --amber-ink:#3A1F0D;
      --purple:#2C5F8A;
      --repair:#C0432E;
      --maint:#2E8B57;
      --radius:14px;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      background:var(--paper);
      font-family:'Inter',sans-serif;
      color:var(--ink);
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:28px 16px 60px;
    }
    .ticket{
      width:100%;
      max-width:520px;
    }

    .brand-mark{
      display:flex;
      justify-content:center;
      margin-bottom:14px;
    }
    .brand-mark img{
      height:64px;
      width:auto;
    }
    .ticket-head{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      margin-bottom:6px;
    }
    .eyebrow{
      font-family:'IBM Plex Mono',monospace;
      font-size:12px;
      letter-spacing:.12em;
      color:var(--purple);
      font-weight:600;
      text-transform:uppercase;
    }
    h1{
      font-family:'Oswald',sans-serif;
      font-weight:700;
      font-size:28px;
      letter-spacing:.01em;
      margin:2px 0 18px;
      text-transform:uppercase;
    }
    .card{
      background:var(--paper-2);
      border-radius:var(--radius);
      box-shadow:0 1px 2px rgba(23,29,36,.06), 0 8px 24px rgba(23,29,36,.06);
      position:relative;
      overflow:hidden;
    }
    .perf{
      height:14px;
      background-image:radial-gradient(circle at 10px 7px, var(--paper) 5px, transparent 5.5px);
      background-size:20px 14px;
      background-position:6px 0;
    }
    .card-body{ padding:26px 24px 24px; }
    .field{ margin-bottom:18px; }
    label{
      display:block;
      font-size:12px;
      font-weight:600;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:var(--slate);
      margin-bottom:6px;
    }
    select, input, textarea{
      width:100%;
      font-family:'Inter',sans-serif;
      font-size:16px;
      padding:12px 13px;
      border:1.5px solid var(--line);
      border-radius:9px;
      background:var(--paper-2);
      color:var(--ink);
      -webkit-appearance:none;
      appearance:none;
    }
    textarea{ resize:vertical; min-height:74px; font-family:'Inter',sans-serif; }
    select:focus, input:focus, textarea:focus{
      outline:none;
      border-color:var(--amber);
      box-shadow:0 0 0 3px rgba(244,168,29,.25);
    }
    .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .counter{
      font-family:'IBM Plex Mono',monospace;
      font-size:11px;
      color:var(--slate);
      text-align:right;
      margin-top:4px;
    }
    .counter.warn{ color:var(--amber); }

    .dash-link-row{ margin-top:20px; text-align:center; }
    .dash-link{
      width:auto;
      background:transparent;
      border:1.5px solid var(--line);
      color:var(--slate);
      border-radius:9px;
      padding:11px 20px;
      font-family:'Oswald',sans-serif;
      font-size:13px;
      letter-spacing:.05em;
      text-transform:uppercase;
      cursor:pointer;
    }
    .dash-link:hover{ border-color:var(--purple); color:var(--purple); }
    .dash-err{
      font-family:'IBM Plex Mono',monospace;
      font-size:12px;
      color:var(--repair);
      min-height:16px;
      margin-top:8px;
    }
    .toggle-group{ display:flex; gap:8px; }
    .toggle{
      flex:1;
      text-align:center;
      padding:12px 8px;
      border-radius:9px;
      border:1.5px solid var(--line);
      font-weight:600;
      font-size:14px;
      cursor:pointer;
      user-select:none;
      background:var(--paper-2);
      transition:all .12s ease;
    }
    .toggle.active-repair{ background:var(--repair); border-color:var(--repair); color:#fff; }
    .toggle.active-maint{ background:var(--maint); border-color:var(--maint); color:#fff; }
    .submit-row{ margin-top:22px; }
    button{
      width:100%;
      background:var(--purple);
      color:#fff;
      border:none;
      border-radius:9px;
      padding:15px;
      font-family:'Oswald',sans-serif;
      font-size:16px;
      font-weight:600;
      letter-spacing:.05em;
      text-transform:uppercase;
      cursor:pointer;
      transition:transform .08s ease, background .15s ease;
    }
    button:active{ transform:scale(.98); }
    button:disabled{ background:#A3ADBB; cursor:default; }
    .status{
      margin-top:14px;
      font-family:'IBM Plex Mono',monospace;
      font-size:13px;
      text-align:center;
      min-height:18px;
    }
    .status.ok{ color:var(--maint); }
    .status.err{ color:var(--repair); }
    .stub{
      display:none;
      text-align:center;
      padding:34px 24px 30px;
    }
    .stub.show{ display:block; }
    .stub-code{
      font-family:'IBM Plex Mono',monospace;
      font-size:13px;
      color:var(--slate);
      letter-spacing:.08em;
    }
    .stub h2{
      font-family:'Oswald',sans-serif;
      text-transform:uppercase;
      margin:10px 0 6px;
      font-size:22px;
    }
    .stub p{ color:var(--slate); font-size:14px; margin:0 0 22px; }
    .again{
      background:transparent;
      border:1.5px solid var(--purple);
      color:var(--purple);
    }
    .lock-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:40px 24px 34px;
    }
    .lock-wrap .eyebrow{ margin-bottom:4px; }
    .lock-wrap h2{
      font-family:'Oswald',sans-serif;
      text-transform:uppercase;
      font-size:20px;
      margin:6px 0 22px;
    }
    .pin-boxes{
      display:flex;
      gap:10px;
      margin-bottom:18px;
    }
    .pin-boxes input{
      width:46px;
      height:56px;
      text-align:center;
      font-family:'IBM Plex Mono',monospace;
      font-size:24px;
      font-weight:600;
      padding:0;
    }
    .pin-boxes input.filled{ border-color:var(--amber); }
    .lock-wrap button{ max-width:220px; }
    .lock-err{
      color:var(--repair);
      font-family:'IBM Plex Mono',monospace;
      font-size:13px;
      min-height:18px;
      margin-top:12px;
    }
  </style>
</head>

    <h1>Log a Repair or Service</h1>

    <div class="card">
      <div class="perf"></div>

      <div class="lock-wrap" id="lockView">
        <span class="eyebrow">Enter Station PIN</span>
        <h2>Station Access</h2>
        <div class="pin-boxes">
          <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit">
          <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit">
          <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit">
          <input type="tel" inputmode="numeric" maxlength="1" class="pin-digit">
        </div>
        <button type="button" id="unlockBtn">Unlock</button>
        <div class="lock-err" id="lockErr"></div>
      </div>

      <div class="card-body" id="formView" style="display:none;">
        <form id="entryForm">
          <div class="field">
            <label for="vehicle">Vehicle #</label>
            <select id="vehicle" required>
              <option value="" disabled selected>Select vehicle…</option>
            </select>
          </div>

          <div class="field">
            <label>Type</label>
            <div class="toggle-group">
              <div class="toggle" id="toggleRepair" data-val="Repair">Repair</div>
              <div class="toggle" id="toggleMaint" data-val="Maintenance">Maintenance</div>
            </div>
            <input type="hidden" id="category" required>
          </div>

          <div class="row2">
            <div class="field">
              <label for="item">Item</label>
              <select id="item" required>
                <option value="" disabled selected>Select&hellip;</option>
                <option>Tires</option>
                <option>Alignment</option>
                <option>Brakes</option>
                <option>Oil change</option>
                <option>Filters</option>
                <option>Engine</option>
                <option>Spark plugs</option>
                <option>Transmission</option>
                <option>Radiator</option>
                <option>Water pump</option>
                <option>Fuel pump</option>
                <option>Fuel tank</option>
                <option>Exhaust</option>
                <option>Muffler</option>
                <option>Battery</option>
                <option>Alternator</option>
                <option>Starter</option>
                <option>Electrical</option>
                <option>Lights</option>
                <option>AC</option>
                <option>Power steering</option>
                <option>Axle</option>
                <option>Chassis</option>
                <option>Shifter</option>
                <option>Doors</option>
                <option>Glass</option>
                <option>Mirror</option>
                <option>Body</option>
                <option>Seat</option>
                <option>Keys</option>
                <option>Tow</option>
                <option>Inspection</option>
                <option>Misc parts</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="cost">Cost ($)</label>
              <input type="number" id="cost" min="0" step="0.01" placeholder="0.00" required>
            </div>
          </div>

          <div class="field">
            <label for="details">Details / Description</label>
            <textarea id="details" maxlength="200" placeholder="What was done, and where&hellip;" required></textarea>
            <div class="counter" id="detailsCount">0 / 200</div>
          </div>

          <div class="row2">
            <div class="field">
              <label for="serviceDate">Date of Service</label>
              <input type="date" id="serviceDate" required>
            </div>
            <div class="field">
              <label for="mileage">Mileage</label>
              <input type="number" id="mileage" min="0" placeholder="e.g. 245000">
            </div>
          </div>

          <div class="field">
            <label for="enteredBy">Entered By</label>
            <input type="text" id="enteredBy" placeholder="Your name" required>
          </div>

          <div class="submit-row">
            <button type="submit" id="submitBtn">Log Entry</button>
          </div>
          <div class="status" id="status"></div>
        </form>
      </div>

      <div class="stub" id="stubView">
        <div class="stub-code" id="stubCode">ENTRY LOGGED</div>
        <h2>Got it.</h2>
        <p id="stubDetail">Saved to the maintenance log.</p>
        <button class="again" id="againBtn">Log Another</button>
      </div>
    </div>

    <div class="dash-link-row">
      <button class="dash-link" id="dashBtn">View Fleet Dashboard &rarr;</button>
      <div class="dash-err" id="dashErr"></div>
    </div>
  </div>

  <script>
    // API endpoint - the Apps Script web app, called with fetch().
    // Cross-origin fetch sends no Google cookies, so there is no account
    // for Google to resolve, which is what makes this work everywhere.
    const API = 'https://script.google.com/macros/s/AKfycbzNC5L925umRPdR_gOzJ2SJunmdjgD1nbzKk7nK0qOTcdZpve1ApNTttxxKp9rfNTyLRA/exec';

    async function api(params) {
      const qs = new URLSearchParams(params).toString();
      const res = await fetch(API + '?' + qs);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Request failed');
      return json.data;
    }

    let enteredPin = '';

    const digits = Array.from(document.querySelectorAll('.pin-digit'));
    const lockView = document.getElementById('lockView');
    const formViewEl = document.getElementById('formView');
    const lockErr = document.getElementById('lockErr');

    digits.forEach((d, i) => {
      d.addEventListener('input', () => {
        d.value = d.value.replace(/[^0-9]/g, '');
        d.classList.toggle('filled', d.value !== '');
        if (d.value && i < digits.length - 1) digits[i + 1].focus();
      });
      d.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !d.value && i > 0) digits[i - 1].focus();
        if (e.key === 'Enter') document.getElementById('unlockBtn').click();
      });
    });
    digits[0].focus();

    document.getElementById('unlockBtn').addEventListener('click', () => {
      const val = digits.map(d => d.value).join('');
      if (val.length < 4) {
        lockErr.textContent = 'Enter all 4 digits.';
        return;
      }
      // The PIN is validated on the server at submit time - it is deliberately
      // not stored in this file, since this page is publicly readable.
      enteredPin = val;
      lockErr.textContent = '';
      lockView.style.display = 'none';
      formViewEl.style.display = 'block';
    });

    const catHidden = document.getElementById('category');
    const tRepair = document.getElementById('toggleRepair');
    const tMaint = document.getElementById('toggleMaint');
    function setCategory(val){
      catHidden.value = val;
      tRepair.classList.toggle('active-repair', val === 'Repair');
      tMaint.classList.toggle('active-maint', val === 'Maintenance');
    }
    tRepair.addEventListener('click', () => setCategory('Repair'));
    tMaint.addEventListener('click', () => setCategory('Maintenance'));

    // default date to today
    document.getElementById('serviceDate').valueAsDate = new Date();

    // live character counter - warns once the FedEx MMR line starts to shrink
    (function(){
      const ta = document.getElementById('details');
      const counter = document.getElementById('detailsCount');
      function update(){
        const n = ta.value.length;
        counter.textContent = n + ' / 200';
        counter.classList.toggle('warn', n > 90);
      }
      ta.addEventListener('input', update);
      update();
    })();

    // populate vehicles from the sheet
    api({ action: 'vehicles' })
      .then(function(vehicles){
        const sel = document.getElementById('vehicle');
        vehicles.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          sel.appendChild(opt);
        });
      })
      .catch(function(err){
        document.getElementById('status').textContent = 'Could not load vehicles: ' + err.message;
        document.getElementById('status').className = 'status err';
      });

    const form = document.getElementById('entryForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(!catHidden.value){
        statusEl.textContent = 'Select Repair or Maintenance above.';
        statusEl.className = 'status err';
        return;
      }
      submitBtn.disabled = true;
      statusEl.textContent = 'Saving…';
      statusEl.className = 'status';

      const payload = {
        pin: enteredPin,
        vehicle: document.getElementById('vehicle').value,
        category: catHidden.value,
        item: document.getElementById('item').value,
        cost: document.getElementById('cost').value,
        details: document.getElementById('details').value,
        serviceDate: document.getElementById('serviceDate').value,
        mileage: document.getElementById('mileage').value,
        enteredBy: document.getElementById('enteredBy').value
      };

      api(Object.assign({ action: 'submit' }, payload))
        .then(function(){
          document.getElementById('formView').style.display = 'none';
          document.getElementById('stubDetail').textContent =
            'Vehicle ' + payload.vehicle + ' — ' + payload.category + ' / ' + payload.item;
          document.getElementById('stubView').classList.add('show');
        })
        .catch(function(err){
          if (/pin/i.test(err.message)) {
            // Wrong PIN - send them back to the lock screen
            statusEl.textContent = '';
            document.getElementById('formView').style.display = 'none';
            lockView.style.display = 'flex';
            lockErr.textContent = 'Incorrect PIN.';
            digits.forEach(d => { d.value = ''; d.classList.remove('filled'); });
            digits[0].focus();
          } else {
            statusEl.textContent = 'Error: ' + err.message;
            statusEl.className = 'status err';
          }
          submitBtn.disabled = false;
        });
    });

    document.getElementById('againBtn').addEventListener('click', function(){
      form.reset();
      setCategory('');
      document.getElementById('serviceDate').valueAsDate = new Date();
      document.getElementById('stubView').classList.remove('show');
      document.getElementById('formView').style.display = 'block';
      submitBtn.disabled = false;
      statusEl.textContent = '';
    });

    // Link to the dashboard, gated by its own passcode.
    // Note: this is a convenience gate, not security - the dashboard is its
    // own public URL and is read-only apart from PIN-protected actions.
    document.getElementById('dashBtn').addEventListener('click', function(){
      const errEl = document.getElementById('dashErr');
      const pass = window.prompt('Passcode:');
      if (pass === null) return;
      if (pass.trim().toLowerCase() === 'booo') {
        errEl.textContent = '';
        window.location.href = 'dashboard.html';
      } else {
        errEl.textContent = 'Incorrect passcode.';
      }
    });
  </script>
</body>
</html>
